# Example configuration — copy to config.yaml and customise.
#
# This file is safe for the public template repo: it contains no personal data.
# In your private fork, create config/config.yaml with your real details and
# commit it there (un-ignore it in .gitignore for the private fork only).
# See README.md → "How this repository is meant to be used".

adzuna:
  country: gb
  results_per_query: 50
  max_age_days: 7
  queries:
    - machine learning engineer
    - machine learning scientist
    - research scientist
    - computational scientist
    - scientific software engineer

candidate:
  name: Example Candidate

  location:
    countries:
      - United Kingdom
    cities:
      - London
      - Cambridge
    remote: true

  titles:
    - Machine Learning Engineer
    - Research Scientist
    - ML Scientist
    - Computational Scientist

  skills:
    must_have:
      - machine learning
    desirable:
      - Python
      - PyTorch
      - deep learning
      - scientific computing
      - numerical modelling

  exclusions:
    - sales
    - marketing
    - director
    - manager

  # Set to false to disable automatic filtering of senior leadership titles
  # (director, head of, VP, chief, CTO, CIO). Useful in fields where those
  # terms appear in relevant job titles. Default: true.
  seniority_filter: true

  cv_path: config/cv.pdf

matching:
  model: sentence-transformers/all-MiniLM-L6-v2
  minimum_score: 0.50
  top_n: 20
  weights:
    semantic: 0.50
    title: 0.20
    skill: 0.15
    location: 0.10
    recency: 0.05

email:
  enabled: true
  max_results: 20

database:
  path: data/job_finder.db
