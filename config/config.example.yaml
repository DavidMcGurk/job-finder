# Example configuration — copy to config.yaml and customise.
#
# This file is safe for the public template repo: it contains no personal data.
# In your private fork, create config/config.yaml with your real details and
# commit it there (un-ignore it in .gitignore for the private fork only).
# See README.md → "How this repository is meant to be used".

adzuna:
  country: gb
  results_per_query: 50
  max_age_days: 7
  queries:
    - machine learning engineer
    - machine learning scientist
    - research scientist
    - computational scientist
    - scientific software engineer

candidate:
  name: Example Candidate

  location:
    countries:
      - United Kingdom
    cities:
      - London
      - Cambridge
    remote: true
    # Areas within acceptable commuting distance. Non-remote jobs outside
    # these areas (and not in the cities above) are filtered out when
    # strict: true. Score 0.8. Leave empty or omit to disable.
    acceptable_areas:
      - Surrey
      - Kent
    # When true, non-remote jobs outside the cities and acceptable_areas
    # are hard-filtered out. Set to false for a softer location score.
    strict: false

  titles:
    - Machine Learning Engineer
    - Research Scientist
    - ML Scientist
    - Computational Scientist

  skills:
    must_have:
      - machine learning
    desirable:
      - Python
      - PyTorch
      - deep learning
      - scientific computing
      - numerical modelling

  exclusions:
    - sales
    - marketing
    - director
    - manager

  # Terms that deprioritise (but don't exclude) matching jobs. The final
  # score is multiplied by deprioritise_factor, pushing these jobs down the
  # ranking without removing them entirely. Useful for job categories that
  # are somewhat relevant but not your primary focus.
  deprioritise:
    - consultant
  # Score multiplier applied to deprioritised jobs (0–1). Lower = stronger
  # deprioritisation. 0.75 reduces the score by 25%. Set to 1.0 to disable.
  deprioritise_factor: 0.75

  # Set to false to disable automatic filtering of senior leadership titles
  # (director, head of, VP, chief, CTO, CIO, principal, lead, executive).
  # Default: true.
  seniority_filter: true
  # Filter out jobs requiring more than this many years of experience.
  # Set to null or omit to disable experience-based filtering.
  max_years_experience: 5

  cv_path: config/cv.pdf

matching:
  model: sentence-transformers/all-MiniLM-L6-v2
  minimum_score: 0.50
  top_n: 20
  weights:
    semantic: 0.50
    title: 0.20
    skill: 0.15
    location: 0.10
    recency: 0.05

email:
  enabled: true
  max_results: 20

database:
  path: data/job_finder.db
