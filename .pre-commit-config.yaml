repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: uv run flake8 --max-line-length=120
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src/]
      - id: black
        name: black
        entry: uv run black --line-length=120 --target-version py314
        language: system
        types: [python]
        stages: [pre-commit, pre-push]
      - id: pytest
        name: pytest
        entry: uv run python -m pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
